<!DOCTYPE html>
<html>
<head>
  <title>AR.js - Interaction clip/tap</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro">
      <a-box
        position="0 0.5 0"
        color="#3498DB"
        material="opacity: 0.5; transparent: true"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
      </a-box>
    </a-marker>

    <a-entity camera>
        <a-cursor fuse="false"></a-cursor>
    </a-entity>

  </a-scene>
  <script>
    const box = document.querySelector('a-box');
    let isFast = false;
    box.addEventListener('click', function () {
      const colors = ['#3498DB', '#F1C40F', '#EF2D5E', '#7BC8A4', '#FF9876', '#9B59B6', '#1ABC9C', '#E74C3C', '#2ECC71', '#F39C12'];
      const newColor = colors[Math.floor(Math.random() * colors.length)];
      box.setAttribute('color', newColor);});

       isFast = !isFast;
      box.setAttribute('animation', {
        property: 'rotation',
        to: '0 360 0',
        loop: true,
        dur: isFast ? 500 : 3000,
        easing: 'linear'
      });

      box.setAttribute('animation__scale', {
        property: 'scale',
        from: '1 1 1',
        to: '1.4 1.4 1.4',
        dur: 200,
        dir: 'alternate',
        loop: 1
      });
    </script>
</body>
</html>
