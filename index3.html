<!DOCTYPE html>
<html>
<head>
  <title>AR.js - Marqueur personnalisé</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Marqueur Hiro (exercices 2 & 3) -->
    <a-marker preset="hiro">
      <a-box
        id="interactiveBox"
        position="0 0.5 0"
        color="#3498DB"
        material="opacity: 0.5; transparent: true"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
      </a-box>
    </a-marker>

    <!-- Marqueur personnalisé (exercice 4) -->
    <a-marker type="pattern" url="C:\Users\richa\Downloads\pattern-FrjF8H4aQAEN_s7.png">
      <a-sphere
        position="0 0.5 0"
        radius="0.5"
        color="#E74C3C"
        material="opacity: 0.7; transparent: true"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-sphere>
    </a-marker>

    <a-entity camera>
      <a-cursor fuse="false"></a-cursor>
    </a-entity>

  </a-scene>
</body>
</html>
