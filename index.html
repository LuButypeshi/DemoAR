<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
        <title>Titre de la Page</title>
    </head>
    <body>
        <h1>Bienvenue sur ma page</h1>
        <a-scene>
                <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#7BC8A4"></a-plane>
                <a-box position="-3 6 0" rotation="0 0 0" width="1" height="1" depth="1" color="#EF2D5E"></a-box>
                <a-box position="0 7 0" color="#3498DB" width="1" height="1" depth="1"></a-box>
                <a-box position="3 8 0" color="#F1C40F" width="1" height="1" depth="1"></a-box>
                <a-entity position="0 10 15" rotation="-30 0 0" camera look-controls></a-entity>
                <a-light type="ambient" color="#BBB"></a-light>
                <a-light type="directional" color="#FFF" intensity="0.6" position="-1 1 1"></a-light>
                <a-sky color="#FF9876"></a-sky>
        </a-scene>
    </body>
</html>
