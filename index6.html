<!DOCTYPE html>
<html>
<head>
  <title>AR.js - UI DOM overlay</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    #ui-overlay {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(0,0,0,0.6);
      padding: 15px 20px;
      border-radius: 10px;
      color: white;
      font-family: sans-serif;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #ui-overlay .colors { display: flex; gap: 10px; }
    #ui-overlay .colors button {
      width: 36px; height: 36px; border-radius: 50%; border: 2px solid white; cursor: pointer;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro" id="hiroMarker">
      <a-box
        id="interactiveBox"
        position="0 0.5 0"
        color="#3498DB"
        scale="1 1 1">
      </a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <!-- DOM overlay UI -->
  <div id="ui-overlay">
    <label>Taille : <input type="range" id="sizeSlider" min="0.1" max="3.0" step="0.1" value="1"></label>
    <div class="colors">
      <button style="background:#E74C3C" data-color="#E74C3C"></button>
      <button style="background:#2ECC71" data-color="#2ECC71"></button>
      <button style="background:#3498DB" data-color="#3498DB"></button>
    </div>
  </div>

  <script>
    const marker = document.querySelector('#hiroMarker');
    const box = document.querySelector('#interactiveBox');
    const ui = document.querySelector('#ui-overlay');
    const slider = document.querySelector('#sizeSlider');

    marker.addEventListener('markerFound', () => {
      ui.style.display = 'flex';
    });

    marker.addEventListener('markerLost', () => {
      ui.style.display = 'none';
    });

    slider.addEventListener('input', (e) => {
      const val = e.target.value;
      box.setAttribute('scale', `${val} ${val} ${val}`);
    });

    document.querySelectorAll('.colors button').forEach(btn => {
      btn.addEventListener('click', () => {
        box.setAttribute('color', btn.dataset.color);
      });
    });
  </script>
</body>
</html>
